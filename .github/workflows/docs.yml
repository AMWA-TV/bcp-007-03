name: Documentation

on:
  push:
    branches:
      - 'v[1-9]*.[0-9]*-dev'
      - 'v[1-9]*.[0-9]*.x'
      - 'publish-*'
    tags:
      - 'v[1-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch or tag to rebuild
        required: false
        default: ''
      alias_latest:
        description: Also publish this build under the latest alias
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  docs:
    uses: AMWA-TV/amwa-spec-docs/.github/workflows/docs.yml@main
    with:
      versioned: true
      site-name: bcp-007-03
      public-docs-root: https://specs.amwa.tv/new/bcp-007-03
      source-ref: ${{ inputs.ref || github.ref_name }}
      alias-latest: ${{ inputs.alias_latest || false }}
      toolkit-ref: main
    secrets: inherit
